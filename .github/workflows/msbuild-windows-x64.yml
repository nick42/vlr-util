name: Build (MSBuild .vcxproj)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_MANIFEST_INSTALL: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v3

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          # Let MSBuild handle package installation via VcpkgEnableManifest in the .vcxproj files
          runVcpkgInstall: false

      - name: Integrate vcpkg with MSBuild
        # Required so that VcpkgEnableManifest=true in .vcxproj works:
        # writes the MSBuild targets that inject vcpkg include/lib paths
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

      - name: Build vlr-util (Release)
        run: msbuild vlr-util\vlr-util.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build vlr-util.test (Release)
        run: msbuild vlr-util.test\vlr-util.test.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Run unit tests and collect results (gtest)
        run: |
          .\vlr-util.test\x64\Release\vlr-util.test.exe --gtest_output=xml:test-results.xml
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: gtest-results
          path: test-results.xml
