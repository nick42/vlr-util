name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_DIR: Build\Bin
  TEST_ARTIFACT_PREFIX: test-results_
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_MANIFEST_INSTALL: 'true'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [Win32, x64, ARM64]

    steps:
      # Step 1: Check out the code from the repo
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Step 2: Prepare for build
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Step 3: Setup vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          # Let MSBuild handle package installation via VcpkgEnableManifest in the .vcxproj files
          runVcpkgInstall: false

      # Step 4: Inject vcpkg into MSBuild
      - name: Integrate vcpkg with MSBuild
        # Required so that VcpkgEnableManifest=true in .vcxproj works:
        # writes the MSBuild targets that inject vcpkg include/lib paths.
        # Triplet (x86-windows / x64-windows) is auto-detected from the MSBuild Platform property.
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

      # Step 5: Build all projects via solution (sets SolutionDir so OutDir resolves correctly)
      - name: Build solution
        run: msbuild vlr-util.sln /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}"

      # Step 6: Run unit tests and emit per-matrix XML report
      - name: Run unit tests and collect results (gtest)
        if: matrix.build_platform == 'Win32' || matrix.build_platform == 'x64'
        run: |
          .\${{ env.BUILD_DIR }}\${{ matrix.build_configuration }}\${{ matrix.build_platform }}\vlr-util.test.exe --gtest_output=xml:${{ env.TEST_ARTIFACT_PREFIX }}${{ matrix.build_platform }}_${{ matrix.build_configuration }}.xml
        continue-on-error: false

      # Step 7: Upload the XML for this matrix combination under a unique artifact name
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEST_ARTIFACT_PREFIX }}${{ matrix.build_platform }}-${{ matrix.build_configuration }}
          path: ${{ env.TEST_ARTIFACT_PREFIX }}${{ matrix.build_platform }}_${{ matrix.build_configuration }}.xml
